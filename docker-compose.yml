services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: locacao-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SenhaForte@2026"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"SenhaForte@2026\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: locacao-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API do MinIO (usada pelo backend e pelo navegador para ver as imagens)
      - "9001:9001"   # Console web do MinIO
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/LocacaoVeiculos.Api
    container_name: locacao-api
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LocacaoVeiculosDB;User Id=sa;Password=SenhaForte@2026;TrustServerCertificate=True;"
      Minio__Endpoint: "minio:9000"
      Minio__PublicEndpoint: "localhost:9000"
      Cors__AllowedOrigin: "http://localhost:4200"
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
    container_name: locacao-frontend
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  sqlserver_data:
  minio_data:
